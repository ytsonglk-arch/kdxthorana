<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Betting Prototype</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b141d;
      color: #e1e6eb;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    /* Header & Balance Section */
    .header {
      background: #14212d;
      padding: 20px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #1e3042;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #0088cc;
    }

    .balance-box {
      background: #0b141d;
      padding: 8px 15px;
      border-radius: 6px;
      border: 1px solid #23384c;
    }

    .balance-amount {
      color: #2ed573;
      font-weight: bold;
      font-size: 1.1rem;
    }

    /* Main Grid Layout */
    .main-content {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    @media (min-width: 600px) {
      .main-content {
        grid-template-columns: 3fr 2fr;
      }
    }

    /* Match Card */
    .card {
      background: #14212d;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #1e3042;
    }

    .card-title {
      font-size: 0.9rem;
      color: #ffa502;
      text-transform: uppercase;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .teams {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .odds-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .odd-btn {
      background: #1e3042;
      border: 1px solid #2c445c;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .odd-btn:hover {
      background: #0088cc;
      border-color: #0088cc;
    }

    .odd-btn.active {
      background: #0088cc;
      border-color: #00aaff;
    }

    .odd-val {
      display: block;
      color: #2ed573;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 4px;
    }

    /* Bet Slip Panel */
    .bet-slip {
      background: #14212d;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #1e3042;
      height: fit-content;
    }

    .slip-header {
      border-bottom: 1px solid #1e3042;
      padding-bottom: 8px;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .selection-info {
      font-size: 0.95rem;
      color: #a4b0be;
      margin-bottom: 15px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: #a4b0be;
      margin-bottom: 5px;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      background: #0b141d;
      border: 1px solid #23384c;
      border-radius: 6px;
      color: #fff;
      font-size: 1rem;
    }

    .input-group input:focus {
      outline: none;
      border-color: #0088cc;
    }

    .payout-box {
      background: #0b141d;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
    }

    .payout-val {
      color: #2ed573;
      font-weight: bold;
    }

    .btn-submit {
      width: 100%;
      background: #2ed573;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #26af5f;
    }

    .btn-submit:disabled {
      background: #2f3640;
      color: #718093;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Header -->
    <header class="header">
      <div class="logo">⚡ MegaBet Demo</div>
      <div class="balance-box">
        ශේෂය: $<span id="user-balance" class="balance-amount">100.00</span>
      </div>
    </header>

    <!-- Content Area -->
    <div class="main-content">
      
      <!-- Match Display -->
      <main class="card">
        <div class="card-title">🏏 Live Cricket - T20 Series</div>
        <div class="teams">Sri Lanka vs India</div>
        
        <div class="odds-grid">
          <button class="odd-btn" id="btn-sl" onclick="selectSelection('Sri Lanka', 2.10, 'btn-sl')">
            Sri Lanka දිනයි
            <span class="odd-val">2.10</span>
          </button>
          
          <button class="odd-btn" id="btn-ind" onclick="selectSelection('India', 1.75, 'btn-ind')">
            India දිනයි
            <span class="odd-val">1.75</span>
          </button>
        </div>
      </main>

      <!-- Bet Slip -->
      <aside class="bet-slip">
        <div class="slip-header">🎟️ Bet Slip</div>
        
        <div id="slip-placeholder" class="selection-info">
          කරුණාකර තරගයේ Odds එකක් තෝරන්න.
        </div>

        <form id="bet-form" style="display: none;" onsubmit="handlePlaceBet(event)">
          <div class="selection-info">
            තෝරාගත් පිල: <strong id="selected-team-text" style="color:#fff;">-</strong><br>
            Odds: <strong id="selected-odds-text" style="color:#2ed573;">0.00</strong>
          </div>

          <div class="input-group">
            <label for="bet-amount">Bet කරන මුදල ($):</label>
            <input type="number" id="bet-amount" min="1" step="any" value="10" oninput="updatePayout()">
          </div>

          <div class="payout-box">
            <span>දිනිය හැකි මුදල:</span>
            <span class="payout-val">$<span id="payout-amount">0.00</span></span>
          </div>

          <button type="submit" class="btn-submit" id="submit-btn">Bet එක තබන්න</button>
        </form>
      </aside>

    </div>
  </div>

  <script>
    // State management
    let balance = 100.00;
    let selectedOdds = 0;
    let selectedTeam = '';

    function selectSelection(team, odds, btnId) {
      selectedTeam = team;
      selectedOdds = odds;

      // Update Active UI for Odds Buttons
      document.querySelectorAll('.odd-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(btnId).classList.add('active');

      // Update Bet Slip View
      document.getElementById('slip-placeholder').style.display = 'none';
      document.getElementById('bet-form').style.display = 'block';

      document.getElementById('selected-team-text').innerText = team;
      document.getElementById('selected-odds-text').innerText = odds.toFixed(2);

      updatePayout();
    }

    function updatePayout() {
      const input = document.getElementById('bet-amount');
      const amount = parseFloat(input.value) || 0;
      const payout = amount * selectedOdds;
      
      document.getElementById('payout-amount').innerText = payout.toFixed(2);

      // Disable submit if amount exceeds balance or invalid
      const submitBtn = document.getElementById('submit-btn');
      if (amount <= 0 || amount > balance) {
        submitBtn.disabled = true;
      } else {
        submitBtn.disabled = false;
      }
    }

    function handlePlaceBet(event) {
      event.preventDefault();

      const amountInput = document.getElementById('bet-amount');
      const amount = parseFloat(amountInput.value);

      if (amount > balance) {
        alert('ඔබගේ ගිණුමේ ප්‍රමාණවත් මුදලක් නොමැත!');
        return;
      }

      // Deduct Balance
      balance -= amount;
      document.getElementById('user-balance').innerText = balance.toFixed(2);

      alert(`සාර්ථකයි! ඔබ $${amount.toFixed(2)} ක මුදලක් ${selectedTeam} වෙනුවෙන් Bet කළා.`);

      // Reset Slip
      document.getElementById('bet-form').style.display = 'none';
      document.getElementById('slip-placeholder').style.display = 'block';
      document.querySelectorAll('.odd-btn').forEach(btn => btn.classList.remove('active'));
      
      selectedOdds = 0;
      selectedTeam = '';
    }
  </script>
</body>
</html>
