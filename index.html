<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1xStyle Betting & Crash Game Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f1c2e;
      color: #ffffff;
    }

    /* Top Navigation Bar */
    .navbar {
      background-color: #14243b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 2px solid #0088cc;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 900;
      font-style: italic;
    }

    .brand span { color: #0088cc; }

    .balance-badge {
      background-color: #0b1420;
      padding: 8px 14px;
      border-radius: 4px;
      border: 1px solid #1e3554;
    }

    .balance-amount {
      color: #2ed573;
      font-weight: bold;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      background: #14243b;
      padding: 0 20px;
      border-bottom: 1px solid #203759;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #8fa0b5;
      padding: 12px 20px;
      font-weight: bold;
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }

    .tab-btn.active {
      color: #0088cc;
      border-bottom-color: #0088cc;
    }

    /* Main Container Grid */
    .layout-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (min-width: 850px) {
      .layout-grid {
        grid-template-columns: 2.5fr 1fr;
      }
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Match Box UI */
    .match-box {
      background: #182a45;
      border-radius: 6px;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #203759;
    }

    .odds-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .odd-card {
      background-color: #0e1929;
      border: 1px solid #233d63;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
    }

    .odd-card:hover { border-color: #0088cc; }
    .odd-card.selected { background-color: #0088cc; }

    /* Aviator / Crash Game Styles */
    .crash-card {
      background: #14243b;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      border: 1px solid #203759;
    }

    .display-screen {
      background: #09111c;
      height: 220px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      border: 1px solid #1e3554;
      margin-bottom: 15px;
    }

    .multiplier-text {
      font-size: 3.5rem;
      font-weight: 900;
      color: #2ed573;
    }

    .plane-icon {
      font-size: 2.5rem;
      position: absolute;
      transition: all 0.1s linear;
      bottom: 20px;
      left: 10px;
    }

    .crash-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-action {
      background-color: #2ed573;
      color: #0b1420;
      border: none;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn-cashout {
      background-color: #fbc531;
      color: #000;
    }

    /* Right Side Panels */
    .side-panel {
      background-color: #14243b;
      border-radius: 6px;
      border: 1px solid #203759;
      padding: 15px;
      margin-bottom: 15px;
    }

    .panel-title {
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 10px;
      border-bottom: 1px solid #203759;
      padding-bottom: 8px;
    }

    /* Bet History Table */
    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .history-table th, .history-table td {
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid #203759;
    }

    .status-won { color: #2ed573; font-weight: bold; }
    .status-lost { color: #e74c3c; font-weight: bold; }
    .status-pending { color: #fbc531; font-weight: bold; }

    .stake-input {
      width: 100%;
      padding: 10px;
      background: #0b1420;
      border: 1px solid #233d63;
      color: #fff;
      border-radius: 4px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar">
    <div class="brand">1x<span>BET</span> DEMO</div>
    <div class="balance-badge">
      ශේෂය: $<span id="user-balance" class="balance-amount">100.00</span>
    </div>
  </nav>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('sports')">🏏 Sports Live</button>
    <button class="tab-btn" onclick="switchTab('aviator')">✈️ Aviator (Crash Game)</button>
  </div>

  <!-- Main Layout -->
  <div class="layout-grid">
    
    <!-- Left Column: Content Screens -->
    <div>
      <!-- TAB 1: Sports Betting -->
      <div id="tab-sports" class="tab-content active">
        <div class="match-box">
          <div style="font-size:0.85rem; color:#8fa0b5;">ICC T20 Series (LIVE)</div>
          <div style="font-size:1.1rem; font-weight:bold; margin: 5px 0;">Sri Lanka vs India</div>
          <div class="odds-row">
            <div class="odd-card" id="odd-sl" onclick="selectSportsOdd('Sri Lanka', 2.20, 'odd-sl')">
              <div>W1 (SL)</div>
              <strong style="color:#2ed573;">2.20</strong>
            </div>
            <div class="odd-card" id="odd-ind" onclick="selectSportsOdd('India', 1.65, 'odd-ind')">
              <div>W2 (IND)</div>
              <strong style="color:#2ed573;">1.65</strong>
            </div>
          </div>
        </div>
      </div>

      <!-- TAB 2: Aviator / Crash Game -->
      <div id="tab-aviator" class="tab-content">
        <div class="crash-card">
          <h2>✈️ Aviator Demo</h2>
          <br>
          <div class="display-screen">
            <div id="plane" class="plane-icon">✈️</div>
            <div id="crash-multiplier" class="multiplier-text">1.00x</div>
            <div id="crash-status" style="color:#e74c3c; font-weight:bold; height:20px;"></div>
          </div>

          <div class="crash-controls">
            <input type="number" id="crash-stake" class="stake-input" value="10" style="width:120px; margin:0;" placeholder="Bet මුදල">
            <button id="btn-start-crash" class="btn-action" onclick="startAviatorGame()">Bet කර Start කරන්න</button>
            <button id="btn-cashout" class="btn-action btn-cashout" style="display:none;" onclick="cashoutAviator()">Cash Out ($<span id="cashout-val">0.00</span>)</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Column: Bet Slip & Bet History -->
    <div>
      <!-- Sports Bet Slip -->
      <div class="side-panel">
        <div class="panel-title">🎟️ Bet Slip</div>
        <div id="slip-empty" style="color:#8fa0b5; font-size:0.9rem;">Odds එකක් තෝරන්න.</div>
        <div id="slip-active" style="display:none;">
          <div id="slip-team" style="font-weight:bold;">-</div>
          <div style="font-size:0.85rem; color:#2ed573; margin-bottom:10px;">Odds: <span id="slip-odds">0.00</span></div>
          <input type="number" id="sports-stake" class="stake-input" value="10" oninput="updateSportsReturn()">
          <div style="font-size:0.9rem; margin-bottom:10px;">දිනිය හැක්කේ: $<span id="sports-win" style="color:#2ed573; font-weight:bold;">0.00</span></div>
          <button class="btn-action" style="width:100%;" onclick="placeSportsBet()">Bet එක තබන්න</button>
        </div>
      </div>

      <!-- Bet History Section -->
      <div class="side-panel">
        <div class="panel-title">📜 තැබූ Bets (History)</div>
        <table class="history-table">
          <thead>
            <tr>
              <th>තෝරාගැනීම</th>
              <th>ගණන</th>
              <th>තත්ත්වය</th>
            </tr>
          </thead>
          <tbody id="history-rows">
            <!-- Dynamic Bet rows go here -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let balance = 100.00;
    let selectedTeam = "";
    let selectedOdds = 0;

    // Navigation Tab Control
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    // --- Sports Betting Logic ---
    function selectSportsOdd(team, odds, elementId) {
      selectedTeam = team;
      selectedOdds = odds;

      document.querySelectorAll('.odd-card').forEach(card => card.classList.remove('selected'));
      document.getElementById(elementId).classList.add('selected');

      document.getElementById('slip-empty').style.display = 'none';
      document.getElementById('slip-active').style.display = 'block';
      document.getElementById('slip-team').innerText = team;
      document.getElementById('slip-odds').innerText = odds.toFixed(2);
      updateSportsReturn();
    }

    function updateSportsReturn() {
      const stake = parseFloat(document.getElementById('sports-stake').value) || 0;
      document.getElementById('sports-win').innerText = (stake * selectedOdds).toFixed(2);
    }

    function placeSportsBet() {
      const stake = parseFloat(document.getElementById('sports-stake').value);
      if (stake > balance) { alert("ප්‍රමාණවත් මුදලක් නැත!"); return; }

      balance -= stake;
      updateBalance();

      addBetHistory(selectedTeam, stake, "Pending");
      alert("Bet එක සාර්ථකයි!");
    }

    // --- Aviator / Crash Game Logic ---
    let crashInterval;
    let currentMultiplier = 1.00;
    let crashPoint = 0;
    let currentAviatorStake = 0;
    let inGame = false;

    function startAviatorGame() {
      const stake = parseFloat(document.getElementById('crash-stake').value);
      if (stake > balance) { alert("ප්‍රමාණවත් මුදලක් නැත!"); return; }

      balance -= stake;
      currentAviatorStake = stake;
      updateBalance();

      inGame = true;
      currentMultiplier = 1.00;
      crashPoint = (Math.random() * 4 + 1.1).toFixed(2); // Random crash between 1.1x and 5.1x

      document.getElementById('crash-status').innerText = "";
      document.getElementById('btn-start-crash').style.display = 'none';
      document.getElementById('btn-cashout').style.display = 'inline-block';

      const plane = document.getElementById('plane');

      crashInterval = setInterval(() => {
        currentMultiplier += 0.03;
        document.getElementById('crash-multiplier').innerText = currentMultiplier.toFixed(2) + "x";
        document.getElementById('cashout-val').innerText = (currentAviatorStake * currentMultiplier).toFixed(2);

        // Plane Animation
        plane.style.left = Math.min((currentMultiplier - 1) * 60, 200) + "px";
        plane.style.bottom = Math.min((currentMultiplier - 1) * 40, 120) + "px";

        if (currentMultiplier >= crashPoint) {
          // Crashed
          clearInterval(crashInterval);
          inGame = false;
          document.getElementById('crash-multiplier').style.color = "#e74c3c";
          document.getElementById('crash-status').innerText = "FLEW AWAY! (CRASHED)";
          
          document.getElementById('btn-start-crash').style.display = 'inline-block';
          document.getElementById('btn-cashout').style.display = 'none';
          
          addBetHistory("Aviator (" + crashPoint + "x)", currentAviatorStake, "Lost");
          
          setTimeout(() => {
            document.getElementById('crash-multiplier').style.color = "#2ed573";
            plane.style.left = "10px";
            plane.style.bottom = "20px";
          }, 1500);
        }
      }, 100);
    }

    function cashoutAviator() {
      if (!inGame) return;
      clearInterval(crashInterval);
      inGame = false;

      const winAmount = currentAviatorStake * currentMultiplier;
      balance += winAmount;
      updateBalance();

      document.getElementById('crash-status').innerText = "CASHED OUT: $" + winAmount.toFixed(2);
      document.getElementById('btn-start-crash').style.display = 'inline-block';
      document.getElementById('btn-cashout').style.display = 'none';

      addBetHistory("Aviator (" + currentMultiplier.toFixed(2) + "x)", currentAviatorStake, "Won");
    }

    // --- Helper Functions ---
    function updateBalance() {
      document.getElementById('user-balance').innerText = balance.toFixed(2);
    }

    function addBetHistory(name, stake, status) {
      const tbody = document.getElementById('history-rows');
      const row = document.createElement('tr');

      let statusClass = "status-pending";
      if (status === "Won") statusClass = "status-won";
      if (status === "Lost") statusClass = "status-lost";

      row.innerHTML = `
        <td>${name}</td>
        <td>$${stake.toFixed(2)}</td>
        <td class="${statusClass}">${status}</td>
      `;
      tbody.prepend(row);
    }
  </script>
</body>
</html>
