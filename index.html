<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1xStyle Betting Platform Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f1c2e; /* 1xbet dark blue background */
      color: #ffffff;
    }

    /* Top Navigation Bar */
    .navbar {
      background-color: #14243b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 2px solid #0088cc;
    }

    .brand {
      font-size: 1.6rem;
      font-weight: 900;
      font-style: italic;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .brand span {
      color: #0088cc; /* 1xbet signature blue */
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .balance-badge {
      background-color: #0b1420;
      padding: 8px 14px;
      border-radius: 4px;
      border: 1px solid #1e3554;
      font-size: 0.95rem;
    }

    .balance-amount {
      color: #2ed573;
      font-weight: bold;
    }

    .deposit-btn {
      background-color: #fbc531; /* Yellow action button */
      color: #000;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Main Container Grid */
    .layout-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (min-width: 850px) {
      .layout-grid {
        grid-template-columns: 3fr 1fr;
      }
    }

    /* Sports / Live Section Header */
    .section-title {
      background: #14243b;
      padding: 12px 15px;
      border-radius: 6px 6px 0 0;
      font-size: 1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 4px solid #0088cc;
    }

    /* Match Box UI */
    .match-box {
      background: #182a45;
      border-radius: 0 0 6px 6px;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #203759;
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #8fa0b5;
      margin-bottom: 10px;
    }

    .live-tag {
      background-color: #e74c3c;
      color: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: bold;
      font-size: 0.75rem;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .teams-container {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    /* Odds Table Grid */
    .odds-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .odd-card {
      background-color: #0e1929;
      border: 1px solid #233d63;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .odd-card:hover {
      border-color: #0088cc;
      background-color: #142a4a;
    }

    .odd-card.selected {
      background-color: #0088cc;
      border-color: #00aaff;
    }

    .odd-label {
      display: block;
      font-size: 0.8rem;
      color: #8fa0b5;
    }

    .odd-card.selected .odd-label {
      color: #e0e0e0;
    }

    .odd-value {
      display: block;
      font-size: 1.1rem;
      font-weight: bold;
      color: #2ed573;
      margin-top: 3px;
    }

    .odd-card.selected .odd-value {
      color: #fff;
    }

    /* Right Side Coupon / Bet Slip */
    .bet-slip-panel {
      background-color: #14243b;
      border-radius: 6px;
      border: 1px solid #203759;
      height: fit-content;
    }

    .slip-title {
      background-color: #182a45;
      padding: 12px;
      font-weight: bold;
      font-size: 1rem;
      border-bottom: 1px solid #203759;
      border-radius: 6px 6px 0 0;
    }

    .slip-body {
      padding: 15px;
    }

    .empty-msg {
      color: #8fa0b5;
      font-size: 0.9rem;
      text-align: center;
      padding: 20px 0;
    }

    .slip-detail-box {
      background: #0e1929;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      border-left: 3px solid #0088cc;
    }

    .stake-input {
      width: 100%;
      padding: 10px;
      background-color: #0b1420;
      border: 1px solid #233d63;
      color: #fff;
      border-radius: 4px;
      font-size: 1rem;
      margin-top: 5px;
      margin-bottom: 12px;
    }

    .stake-input:focus {
      outline: none;
      border-color: #0088cc;
    }

    .return-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      margin-bottom: 15px;
    }

    .return-amount {
      color: #2ed573;
      font-weight: bold;
    }

    .place-bet-btn {
      width: 100%;
      background-color: #2ed573;
      color: #0b1420;
      border: none;
      padding: 12px;
      font-weight: bold;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .place-bet-btn:hover {
      background-color: #25be63;
    }

    .place-bet-btn:disabled {
      background-color: #2c3e50;
      color: #7f8c8d;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <div class="brand">1x<span>BET</span> <small style="font-size:0.5em; color:#fff;">DEMO</small></div>
    <div class="user-info">
      <div class="balance-badge">
        ශේෂය: $<span id="user-balance" class="balance-amount">100.00</span>
      </div>
      <button class="deposit-btn" onclick="addDemoFunds()">+ Deposit</button>
    </div>
  </nav>

  <!-- Main Content Layout -->
  <div class="layout-grid">
    
    <!-- Left Column: Matches -->
    <div>
      <div class="section-title">
        <span class="live-tag">LIVE</span> සජීවී තරග (Cricket)
      </div>

      <div class="match-box">
        <div class="match-header">
          <span>ICC T20 World Cup</span>
          <span>Overs: 14.2</span>
        </div>
        
        <div class="teams-container">
          Sri Lanka vs India
        </div>

        <div class="odds-row">
          <div class="odd-card" id="odd-1" onclick="selectOdd('Sri Lanka', 2.25, 'odd-1')">
            <span class="odd-label">W1 (Sri Lanka)</span>
            <span class="odd-value">2.25</span>
          </div>
          <div class="odd-card" id="odd-x" onclick="selectOdd('Draw', 15.00, 'odd-x')">
            <span class="odd-label">X (Draw)</span>
            <span class="odd-value">15.00</span>
          </div>
          <div class="odd-card" id="odd-2" onclick="selectOdd('India', 1.65, 'odd-2')">
            <span class="odd-label">W2 (India)</span>
            <span class="odd-value">1.65</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Column: Bet Slip / Coupon -->
    <div class="bet-slip-panel">
      <div class="slip-title">📄 BET SLIP</div>
      <div class="slip-body">
        
        <div id="empty-slip" class="empty-msg">
          Bet එකක් තැබීමට Odds එකක් තෝරන්න.
        </div>

        <form id="slip-form" style="display: none;" onsubmit="confirmBet(event)">
          <div class="slip-detail-box">
            <div style="font-size: 0.85rem; color: #8fa0b5;">තෝරාගැනීම:</div>
            <div id="slip-team" style="font-weight: bold; margin-top: 2px;">-</div>
            <div style="font-size: 0.85rem; color: #2ed573; margin-top: 5px;">
              Odds: <span id="slip-odds" style="font-weight: bold;">0.00</span>
            </div>
          </div>

          <label style="font-size: 0.85rem; color: #8fa0b5;">Bet ප්‍රමාණය ($):</label>
          <input type="number" id="stake-amount" class="stake-input" value="10" min="1" step="any" oninput="calculateReturn()">

          <div class="return-row">
            <span>දිනිය හැකි මුදල:</span>
            <span class="return-amount">$<span id="potential-win">0.00</span></span>
          </div>

          <button type="submit" id="submit-btn" class="place-bet-btn">BET එක තබන්න</button>
        </form>

      </div>
    </div>

  </div>

  <script>
    let userBalance = 100.00;
    let activeOdds = 0;
    let activeTeam = "";

    function selectOdd(team, odds, elementId) {
      activeTeam = team;
      activeOdds = odds;

      // Remove active state from all odds cards
      document.querySelectorAll('.odd-card').forEach(card => card.classList.remove('selected'));
      
      // Highlight selected odd card
      document.getElementById(elementId).classList.add('selected');

      // Update Bet Slip
      document.getElementById('empty-slip').style.display = 'none';
      document.getElementById('slip-form').style.display = 'block';

      document.getElementById('slip-team').innerText = team;
      document.getElementById('slip-odds').innerText = odds.toFixed(2);

      calculateReturn();
    }

    function calculateReturn() {
      const stake = parseFloat(document.getElementById('stake-amount').value) || 0;
      const win = stake * activeOdds;
      document.getElementById('potential-win').innerText = win.toFixed(2);

      const submitBtn = document.getElementById('submit-btn');
      if (stake <= 0 || stake > userBalance) {
        submitBtn.disabled = true;
      } else {
        submitBtn.disabled = false;
      }
    }

    function confirmBet(e) {
      e.preventDefault();
      const stake = parseFloat(document.getElementById('stake-amount').value);

      if (stake > userBalance) {
        alert("ඔබගේ ගිණුමේ ප්‍රමාණවත් මුදලක් නොමැත!");
        return;
      }

      userBalance -= stake;
      document.getElementById('user-balance').innerText = userBalance.toFixed(2);

      alert(`සාර්ථකයි! $${stake.toFixed(2)} ක Bet එකක් ${activeTeam} වෙනුවෙන් තබන ලදී.`);

      // Reset Slip
      document.getElementById('slip-form').style.display = 'none';
      document.getElementById('empty-slip').style.display = 'block';
      document.querySelectorAll('.odd-card').forEach(card => card.classList.remove('selected'));

      activeOdds = 0;
      activeTeam = "";
    }

    function addDemoFunds() {
      userBalance += 50.00;
      document.getElementById('user-balance').innerText = userBalance.toFixed(2);
    }
  </script>
</body>
</html>
